[bootstrap.packages]
"pacman:alacritty" = "latest"
"pacman:bat" = "latest"
"pacman:cachyos-gaming-applications" = "latest" # Pulls the gaming meta, which pulls steam
"pacman:cachyos-rate-mirrors" = "latest"        # Aliased in config.fish behind a type -q guard
"pacman:curl" = "latest"
"pacman:discord" = "latest"
"pacman:expac" = "latest"
"pacman:eza" = "latest"
"pacman:fastfetch" = "latest"
"pacman:fd" = "latest"
"pacman:firefox" = "latest"
"pacman:fish" = "latest"
"pacman:fisher" = "latest"
"pacman:gcc" = "latest"
"pacman:git" = "latest"
"pacman:git-delta" = "latest"
"pacman:hwinfo" = "latest"
"pacman:neovide" = "latest"
"pacman:obsidian" = "latest"
"pacman:openssh" = "latest"
"pacman:paru" = "latest"
"pacman:ripgrep" = "latest"
"pacman:spotify-launcher" = "latest"
"pacman:television" = "latest"
"pacman:ttf-nerd-fonts-symbols-mono" = "latest"
"pacman:zoxide" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/fish"

# AUR is unsupported in [bootstrap.packages], so paru handles it after that phase
# Keymapp is a separate call because its upstream tarball is unversioned, so its
# build breaks on every ZSA release until the AUR maintainer bumps the checksum
[tasks.aur]
run = [
  "paru -S --needed --noconfirm 1password 1password-cli",
  "paru -S --needed --noconfirm zsa-keymapp-bin",
]
