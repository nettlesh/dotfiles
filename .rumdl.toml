[global]
# CLAUDE.md is a one-line pointer file, so MD041 cannot apply
# TODO: nvim/ is a vendored upstream starter, excluded while it stays verbatim
exclude = ["CLAUDE.md", "nvim"]

# Markdown Style Guide wrap:inner-sentence, which rumdl implements as semantic line breaks
# https://cirosantilli.com/markdown-style-guide/#line-wrapping
[MD013]
reflow = true
reflow-mode = "semantic-line-breaks"
