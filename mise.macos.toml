[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:keymapp" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:zen" = "latest"
"brew:fish" = "latest"
"brew:fisher" = "latest"
"brew:git" = "latest"
"brew:neovim" = "latest"
"brew:starship" = "latest"
"brew:terminal-notifier" = "latest"

[bootstrap.macos.dock]
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"
