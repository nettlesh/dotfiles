[env]
_.path = ["~/.local/bin", "/opt/homebrew/bin"]

[bootstrap.packages]
"brew:fish" = "latest"
"brew:fisher" = "latest"
"brew:git" = "latest"
"brew:neovim" = "latest"
"brew:terminal-notifier" = "latest"

[bootstrap.brew]
adopt = true

# codex user state stays writable while shared defaults use its system layer
[bootstrap.directories."/etc/codex"]
owner = "root"
group = "wheel"

[bootstrap.files."/etc/codex/config.toml"]
source = "codex/config.toml"
owner = "root"
group = "wheel"

[bootstrap.macos.dock]
mru_spaces = false
show_recents = false

[bootstrap.macos.finder]
preferred_view_style = "list"
show_all_files = true
show_pathbar = true
show_status_bar = true

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"
