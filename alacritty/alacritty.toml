[cursor.style]
blinking = "Always"

[font]
size = 12

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[window]
dynamic_padding = true
option_as_alt   = "Both"

# TODO: remove with the theme block
opacity = 0.8

[window.dimensions]
columns = 160
lines   = 40

[window.padding]
x = 8
y = 8

# TODO: remove once the theme layer exists
# CachyOS defaults, kept as an interim look
[colors.primary]
background = "0x2E3440"
foreground = "0xD8DEE9"

[colors.normal]
black   = "0x3B4252"
blue    = "0x81A1C1"
cyan    = "0x88C0D0"
green   = "0xA3BE8C"
magenta = "0xB48EAD"
red     = "0xBF616A"
white   = "0xE5E9F0"
yellow  = "0xEBCB8B"

[colors.bright]
black   = "0x4C566A"
blue    = "0x81A1C1"
cyan    = "0x8FBCBB"
green   = "0xA3BE8C"
magenta = "0xB48EAD"
red     = "0xBF616A"
white   = "0xECEFF4"
yellow  = "0xEBCB8B"
