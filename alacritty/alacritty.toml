[cursor.style]
blinking = "Always"

[font]
size = 12

# Sends ESC+CR so terminal applications can tell Shift+Enter from Enter
[[keyboard.bindings]]
chars = "\u001B\r"
key = "Return"
mods = "Shift"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[window]
dynamic_padding = true
option_as_alt = "Both"

# TODO: remove with the theme block
opacity = 0.8

[window.dimensions]
columns = 160
lines = 40

[window.padding]
x = 8
y = 8

# TODO: remove once the theme layer exists
# CachyOS defaults, kept as an interim look
[colors.primary]
background = "#2e3440"
foreground = "#d8dee9"

[colors.normal]
black = "#3b4252"
blue = "#81a1c1"
cyan = "#88c0d0"
green = "#a3be8c"
magenta = "#b48ead"
red = "#bf616a"
white = "#e5e9f0"
yellow = "#ebcb8b"

[colors.bright]
black = "#4c566a"
blue = "#81a1c1"
cyan = "#8fbcbb"
green = "#a3be8c"
magenta = "#b48ead"
red = "#bf616a"
white = "#eceff4"
yellow = "#ebcb8b"
