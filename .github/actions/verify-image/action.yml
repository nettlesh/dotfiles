name: Verify image
description: Build the image and scan for security findings

inputs:
  mise-version:
    description: mise version used to install Trivy
    required: true

runs:
  using: composite
  steps:
    - name: Set up Trivy
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        version: ${{ inputs.mise-version }}
        install_args: trivy
        cache: false

    - name: Build image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        load: true
        platforms: linux/amd64

    - name: Report vulnerabilities
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: |
        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          "$IMAGE_ID"

    - name: Check critical vulnerabilities
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: |
        trivy image \
          --scanners vuln \
          --severity CRITICAL \
          --exit-code 1 \
          "$IMAGE_ID"

    - name: Check secrets and configuration
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: |
        trivy image \
          --scanners secret \
          --image-config-scanners misconfig,secret \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          "$IMAGE_ID"
