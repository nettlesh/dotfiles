name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main finish publishing even when another commit arrives
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: 2026.9.12

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    env:
      HK_CONFIG_DIR: ${{ github.workspace }}/hk
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/mise
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install --yes fish

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Check source files
        run: mise run check

      - name: Scan Git history for secrets
        run: mise exec -- betterleaks git --redact --no-banner .

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: archlinux:base@sha256:63c7b061c0c001cb7ce4f8d11b63d351c23e7f97121bc5c8bd5d9f431e615d7d
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Arch container
        run: |
          pacman -Syu --noconfirm curl git sudo
          curl --proto '=https' --proto-redir '=https' \
            --fail --show-error --silent --location https://mise.run |
            MISE_INSTALL_PATH=/usr/local/bin/mise sh
          useradd --create-home --user-group --shell /bin/bash sebastian
          printf '%s\n' 'sebastian ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/sebastian
          chmod 0440 /etc/sudoers.d/sebastian

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare dotfiles checkout
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/sebastian/.dotfiles
          chown -R sebastian:sebastian /home/sebastian/.dotfiles
          cd /home/sebastian/.dotfiles
          sudo -nH mise trust --all --quiet

      - name: Install system packages
        working-directory: /home/sebastian/.dotfiles
        shell: sudo -nH -u sebastian bash -eo pipefail {0}
        run: |
          mise trust --all --quiet
          mise bootstrap packages apply --yes

      - name: Set login shell
        timeout-minutes: 2
        working-directory: /home/sebastian/.dotfiles
        shell: sudo -nH -u sebastian bash -eo pipefail {0}
        # mise uses SUDO_USER to select the account whose shell it changes
        run: sudo -nH mise bootstrap user apply --yes

      - name: Bootstrap
        working-directory: /home/sebastian/.dotfiles
        shell: sudo -nH -u sebastian --preserve-env=MISE_GITHUB_TOKEN bash -eo pipefail {0}
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Keep the user phase so its post-user hook adds Docker group membership
          mise --locked bootstrap --yes --skip packages,services,final-hook
          mise bootstrap packages status --missing
          mise bootstrap files status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap user status --missing
          mise --locked install --dry-run-code

  macos:
    name: macOS
    needs: check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: Prepare dotfiles checkout
        run: cp -a "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Install system packages
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$HOME/.dotfiles"
          mise trust --all --quiet
          mise bootstrap packages apply --yes

      - name: Set login shell
        timeout-minutes: 2
        run: |
          cd "$HOME/.dotfiles"
          mise_bin="$(command -v mise)"
          sudo -nH "$mise_bin" trust --all --quiet
          sudo -nH "$mise_bin" bootstrap user apply --yes

      - name: Bootstrap
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$HOME/.dotfiles"
          # Package/user apply omits phase hooks; update CI if either phase gains hooks
          mise --locked bootstrap --yes --skip packages,user

  image:
    name: Image
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify image
        uses: $/.github/actions/verify-image
        with:
          mise-version: ${{ env.MISE_VERSION }}

  release:
    name: Release
    needs: [linux, macos, image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
    uses: $/.github/workflows/release.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
