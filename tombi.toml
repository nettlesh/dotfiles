# Matches mise's own formatter byte-for-byte, so both can format these files
[format.rules]
trailing-comment-alignment = true
trailing-comment-space-width = 1

[[schemas]]
path = "https://mise.jdx.dev/schema/mise.json"
include = ["mise.toml", "mise.*.toml", "**/mise/config.toml"]

# Keeps these tables alphabetical
# NOTE: Must stay attached to the mise schema above
#       [[schemas.overrides]] binds to the nearest preceding [[schemas]]
[[schemas.overrides]]
targets = ["tools", "dotfiles", "env", "bootstrap.packages"]

[schemas.overrides.format.rules]
table-keys-order = "ascending"

[[schemas]]
path = "https://starship.rs/config-schema.json"
include = ["**/starship.toml"]
