min_version = "2026.7.16"

[dotfiles]
"~/.config/bat/config" = "bat/config"
"~/.config/ghostty/config.ghostty" = "ghostty/config.ghostty"
"~/.config/fish" = { source = "fish", mode = "symlink-each" }
"~/.config/git/config" = { source = "git/config.tmpl", mode = "template" }
"~/.config/herdr" = { source = "herdr", mode = "symlink-each" }            # herdr writes logs and session state here
"~/.config/hk" = "hk"
"~/.config/mise" = "mise"
"~/.config/nvim" = "nvim"
"~/.config/ripgrep" = "ripgrep"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/tealdeer/config.toml" = "tealdeer/config.toml"

[tools]
editorconfig-checker = "latest"
hk = "latest"
pkl = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"

# Lets hk find its linters through mise when git runs the hooks
[env]
HK_MISE = 1

# Runs second to last in bootstrap, after tools are installed and dotfiles are linked
# Guards test for the command rather than the OS, so this stays platform-neutral
[tasks.bootstrap]
run = [
  "mkdir -p {{ xdg_config_home }}/fish/completions",
  "mise completion fish >{{ xdg_config_home }}/fish/completions/mise.fish",
  "{{ '/opt/homebrew/bin/fish' if os() == 'macos' else '/usr/bin/fish' }} -c 'fisher update'",
  "if command -v paru >/dev/null; then mise run aur; fi",
]

# mise cannot see AUR packages, so pacman -Q carries that assertion instead
[tasks.check]
run = [
  "mise bootstrap dotfiles status --missing",
  "mise bootstrap packages status --missing",
  "if command -v pacman >/dev/null; then pacman -Q 1password 1password-cli zsa-keymapp-bin >/dev/null; fi",
]

[tasks.fmt]
run = "hk fix --all"

[tasks.lint]
run = "hk check --all"

[tasks.pre-commit]
run = "hk run pre-commit"
