min_version = "2026.9.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[vars]
git_email = { required = "Set git_email in mise.local.toml or the process environment" }
git_signing_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFOWqnOUZkNfa0mvlobU+pg15gwMi5F4/5Ab9lf9y8vP"
op_personal_account = "my.1password.com"
op_work_account = "obscurity-labs.1password.com"

[bootstrap.hooks.post-tools]
run = [
  'mkdir -p "{{ xdg_config_home }}/fish/completions"',
  'mise completion fish >"{{ xdg_config_home }}/fish/completions/mise.fish"',
  "{{ '/opt/homebrew/bin/fish' if os() == 'macos' else '/usr/bin/fish' }} -c 'fisher update'",
]

[dotfiles]
"~/.claude" = { source = "claude", mode = "symlink-each" }
"~/.config/bat/config" = "bat/config"
"~/.config/fastfetch/config.jsonc" = "fastfetch/config.jsonc"
"~/.config/fish" = { source = "fish", mode = "symlink-each" }
"~/.config/fnox/config.toml" = "fnox/config.toml"
"~/.config/ghostty/config.ghostty" = "ghostty/config.ghostty"
"~/.config/git/config" = { source = "git/config.tmpl", mode = "template" }
"~/.config/herdr/config.toml" = "herdr/config.toml"
"~/.config/hk" = "hk"
"~/.config/mise" = "mise"
"~/.config/nvim" = "nvim"
"~/.config/ripgrep" = "ripgrep"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/tealdeer/config.toml" = "tealdeer/config.toml"

[tools]
editorconfig-checker = "latest"
hk = "latest"
pkl = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"

# Let hk find its linters through mise when Git runs the hooks
[env]
HK_MISE = 1

[tasks."bootstrap:identity"]
hide = true
interactive = true
run = '''
set -eu

op_personal_account="{{ vars.op_personal_account }}"
op_work_account="{{ vars.op_work_account }}"

for account in "$op_personal_account" "$op_work_account"; do
    if ! op account get --account "$account" >/dev/null 2>&1; then
        eval "$(op account add --address "$account" --signin)"
    fi
done

age_file="{{ xdg_config_home }}/fnox/age.txt"
if [ ! -f "$age_file" ]; then
    eval "$(op signin --account "$op_personal_account")"
    mkdir -p "$(dirname "$age_file")"
    # age identity file document, by ID so renaming the item can't break bootstrap
    op document get pfrztbtg5nchqnm6gdsnx72yqq \
        --account "$op_personal_account" \
        --out-file "$age_file"
fi
'''

[tasks."bootstrap:claude"]
hide = true
run = '''
set -eu

if ! claude mcp get hk >/dev/null 2>&1; then
    claude mcp add --scope user --transport stdio hk -- hk mcp --root .
fi

if ! claude mcp get mise >/dev/null 2>&1; then
    claude mcp add --scope user --env MISE_EXPERIMENTAL=1 --transport stdio mise -- mise mcp
fi

if ! claude mcp get fnox >/dev/null 2>&1; then
    claude mcp add --scope user --transport stdio fnox -- fnox --config "{{ xdg_config_home }}/fnox/config.toml" mcp
fi
'''

[tasks.check]
run = ["mise bootstrap status --missing", "fnox check", "hk check --all"]

[tasks.pre-commit]
run = "hk run pre-commit"
