# Earlier releases break the mise MCP server for Claude Code (jdx/mise#14409)
min_version = { hard = "2026.9.12", soft = "2026.10.9" }

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[settings.skills]
dir = ".agents/skills"
auto_sync = true
prune = true

[vars]
git_email = { default = "" }
git_signing_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFOWqnOUZkNfa0mvlobU+pg15gwMi5F4/5Ab9lf9y8vP"
op_personal_account = "my.1password.com"
op_work_account = "obscurity-labs.1password.com"

# hk finds its linters through mise when Git runs hooks
[env]
HK_MISE = 1

[tools]
betterleaks = "latest"
communique = "latest"
editorconfig-checker = "latest"
hadolint = "latest"
hk = "latest"
# TODO: Track latest once hk releases its jactionlint v2 builtin (jdx/hk#1687)
jactionlint = "1"
pkl = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
trivy = "latest"
zizmor = "latest"

[dotfiles]
"~/.agents/skills/herdr" = "agents/skills/herdr"
"~/.bashrc" = "bash/.bashrc"
"~/.claude" = { source = "claude", mode = "symlink-each" }
"~/.claude/skills/herdr" = "agents/skills/herdr"
"~/.codex/herdr-agent-state.sh" = "codex/herdr-agent-state.sh"
"~/.codex/hooks.json" = "codex/hooks.json"
"~/.config/bat/config" = "bat/config"
"~/.config/fastfetch/config.jsonc" = "fastfetch/config.jsonc"
"~/.config/fish" = { source = "fish", mode = "symlink-each" }
"~/.config/fnox/config.toml" = "fnox/config.toml"
"~/.config/ghostty/config.ghostty" = "ghostty/config.ghostty"
"~/.config/git/config" = "git/config"
"~/.config/git/delta" = "git/delta"
"~/.config/git/identity" = { source = "git/identity.tmpl", mode = "template" }
"~/.config/herdr/config.toml" = "herdr/config.toml"
"~/.config/hk" = "hk"
"~/.config/mise" = { source = "mise", mode = "symlink-each" }
"~/.config/nvim" = "nvim"
"~/.config/ripgrep" = "ripgrep"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/tealdeer/config.toml" = "tealdeer/config.toml"
"~/.zshrc" = "zsh/.zshrc"

[bootstrap.directories."~/.ssh/config.d"]
mode = "0700"

[bootstrap.hooks.pre-dotfiles]
run = '''
if [ -n {{ vars.git_email | quote }} ]; then
    touch {{ config_root | quote }}/mise.local.toml
    {{ mise_bin | quote }} config set --file {{ config_root | quote }}/mise.local.toml --type string vars.git_email {{ vars.git_email | quote }}
fi
'''

[bootstrap.hooks.post-tools]
run = [
  'mkdir -p "{{ xdg_config_home }}/fish/completions"',
  'mise completion fish >"{{ xdg_config_home }}/fish/completions/mise.fish"',
  "{{ '/opt/homebrew/bin/fish' if os() == 'macos' else '/usr/bin/fish' }} -c 'fisher update' </dev/null",
]

[bootstrap.hooks.final]
run = "mise bootstrap status --missing"

# The 1Password plugin needs the desktop app, which personal and work require
[tasks."bootstrap:claude"]
hide = true
depends = ["bootstrap:claude:core"]
run = '''
set -eu

if ! claude mcp get fnox >/dev/null 2>&1; then
    claude mcp add --scope user --transport stdio fnox -- fnox --config "{{ xdg_config_home }}/fnox/config.toml" mcp
fi

claude plugin marketplace add cloudflare/skills
claude plugin install cloudflare@cloudflare
claude plugin update cloudflare@cloudflare
claude plugin marketplace add 1Password/1password-claude-plugin
claude plugin install 1password@1password
claude plugin update 1password@1password
'''

# Restricted machines run this too
[tasks."bootstrap:claude:core"]
hide = true
run = '''
set -eu

if ! claude mcp get hk >/dev/null 2>&1; then
    claude mcp add --scope user --transport stdio hk -- \
        sh -c 'exec hk mcp --root "$CLAUDE_PROJECT_DIR"'
fi

if ! claude mcp get mise >/dev/null 2>&1; then
    claude mcp add mise --scope user --env MISE_EXPERIMENTAL=1 --transport stdio -- mise mcp
fi
'''

# The 1Password plugin needs the desktop app, which personal and work require
[tasks."bootstrap:codex"]
hide = true
depends = ["bootstrap:codex:core"]
run = '''
set -eu

if ! codex mcp get fnox >/dev/null 2>&1; then
    codex mcp add fnox -- fnox --config "{{ xdg_config_home }}/fnox/config.toml" mcp
fi

# Plugins install from the marketplace's local snapshot, so refresh it first
codex plugin marketplace add cloudflare/skills
codex plugin marketplace upgrade cloudflare
codex plugin add cloudflare@cloudflare
# NOTE: The directory's 1Password plugin omits the MCP server; this marketplace keeps it
codex plugin marketplace add 1Password/1password-codex-plugin
codex plugin marketplace upgrade 1password-plugins
codex plugin add 1password@1password-plugins
'''

# Restricted machines run this too
[tasks."bootstrap:codex:core"]
hide = true
run = '''
set -eu

if ! codex mcp get hk >/dev/null 2>&1; then
    codex mcp add hk -- hk mcp
fi

if ! codex mcp get mise >/dev/null 2>&1; then
    codex mcp add mise --env MISE_EXPERIMENTAL=1 -- mise mcp
fi
'''

[tasks."bootstrap:identity"]
hide = true
interactive = true
run = '''
set -eu

op_personal_account="{{ vars.op_personal_account }}"
op_work_account="{{ vars.op_work_account }}"

for account in "$op_personal_account" "$op_work_account"; do
    if ! op account get --account "$account" >/dev/null 2>&1; then
        eval "$(op account add --address "$account" --signin)"
    fi
done

age_file="{{ xdg_config_home }}/fnox/age.txt"
if [ ! -f "$age_file" ]; then
    eval "$(op signin --account "$op_personal_account")"
    mkdir -p "$(dirname "$age_file")"
    # age identity file document, by ID so renaming the item can't break bootstrap
    op document get pfrztbtg5nchqnm6gdsnx72yqq \
        --account "$op_personal_account" \
        --out-file "$age_file"
fi
'''

[tasks.check]
description = "Check source files"
run = "hk check --all"

[tasks.fix]
description = "Fix source files"
run = "hk fix --all"

[tasks.pre-commit]
run = "hk run pre-commit"
