min_version = "2026.7.16"

[dotfiles]
"~/.config/alacritty" = { source = "alacritty", mode = "symlink-each" }    # Tools that edit this config leave backup files beside it
"~/.config/fish" = { source = "fish", mode = "symlink-each" }
"~/.config/git/config" = { source = "git/config.tmpl", mode = "template" }
"~/.config/herdr" = { source = "herdr", mode = "symlink-each" }            # herdr writes logs and session state here
"~/.config/hk" = "hk"
"~/.config/mise" = "mise"
"~/.config/nvim" = "nvim"
"~/.config/ripgrep" = "ripgrep"

[tools]
editorconfig-checker = "latest"
hk = "latest"
pkl = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"

# Lets hk find its linters through mise when git runs the hooks
[env]
HK_MISE = 1

# Runs as bootstrap step 10, after tools are installed and dotfiles are linked
[tasks.bootstrap]
run = [
  "mkdir -p {{ xdg_config_home }}/fish/completions",
  "mise completion fish >{{ xdg_config_home }}/fish/completions/mise.fish",
  "fish -c 'fisher update'",
]

[tasks.check]
run = [
  "mise bootstrap dotfiles status --missing",
  "mise bootstrap packages status --missing",
]

[tasks.fmt]
run = "hk fix --all"

[tasks.lint]
run = "hk check --all"

[tasks.pre-commit]
run = "hk run pre-commit"
