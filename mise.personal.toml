[env]
FNOX_PROFILE = "personal"
OP_ACCOUNT = "{{ vars.op_personal_account }}"

# Cloned before dotfiles deploy the 1Password SSH config, so this uses HTTPS
[bootstrap.repos]
"~/homelab" = { url = "https://github.com/nettlesh/homelab.git" }

[bootstrap.hooks.post-dotfiles]
run = '"{{ mise_bin }}" set --file "{{ xdg_config_home }}/mise/config.local.toml" FNOX_PROFILE=personal OP_ACCOUNT={{ vars.op_personal_account | quote }}'

# fnox check needs profile secrets, so it cannot run on the baseline
[bootstrap.hooks.final]
run = "fnox check"

[tasks.bootstrap]
run = [
  { task = "bootstrap:identity" },
  { task = "bootstrap:claude" },
  { task = "bootstrap:codex" },
]
